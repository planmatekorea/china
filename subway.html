function fg(c) { var n = parseInt(c.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#222' : '#fff'; }
function el(t, a, p) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }

var gL = el('g', {}, svg), gS = el('g', {}, svg), gT = el('g', {}, svg);
var lineEls = {};
order.forEach(function (id) {
  var g = el('g', { 'data-l': id }, gL); lineEls[id] = g;
  (D.paths[id] || []).forEach(function (d) { var p = el('path', { d: d, stroke: D.colors[id], 'class': 'ln' }, g); });
});
var stEls = [];
D.stations.forEach(function (s, i) {
  var x = s.lines.length > 1;
  var c = el('circle', { cx: s.x, cy: s.y, r: x ? 4.4 : 3.2, 'class': 'st' + (x ? ' x' : ''), 'data-s': i }, gS);
  stEls.push(c);
  var t = el('text', { x: s.x, y: s.y, 'class': 'lb' + (s.major ? ' M' : '') }, gT);
  var a = el('tspan', { 'class': 'zh' }, t); a.textContent = s.zh;
  if (s.en) { var b = el('tspan', { 'class': 'en', x: s.x, dy: '1.05em' }, t); b.textContent = s.en; }
  if (s.ko) { var k = el('tspan', { 'class': 'ko', x: s.x, dy: '1.05em' }, t); k.textContent = s.ko; }
});

// chips
var chipsEl = document.getElementById('chips'), focus = null;
order.forEach(function (id) {
  var b = document.createElement('button'); b.className = 'chip'; b.textContent = chipText(id);
  b.style.background = D.colors[id]; b.style.color = fg(D.colors[id]); b.title = lname(id); b.dataset.l = id;
  b.addEventListener('click', function () { focus = (focus === id) ? null : id; applyFocus(); });
  chipsEl.appendChild(b);
});
function applyFocus() {
  order.forEach(function (id) { lineEls[id].classList.toggle('dim-l', !!focus && focus !== id); });
  [].forEach.call(chipsEl.children, function (b) { b.classList.toggle('dim', !!focus && b.dataset.l !== focus); });
  stEls.forEach(function (c, i) { c.style.opacity = (!focus || D.stations[i].lines.indexOf(focus) > -1) ? '' : '.15'; });
}

// viewBox
var vb = { x: 0, y: 0, w: 400 };
function W() { return wrap.clientWidth || 360; } function H() { return wrap.clientHeight || 640; }
function apply() {
  var h = vb.w * H() / W();
  svg.setAttribute('viewBox', vb.x.toFixed(1) + ' ' + vb.y.toFixed(1) + ' ' + vb.w.toFixed(1) + ' ' + h.toFixed(1));
  var upp = vb.w / W();
  var lw = Math.max(2.4, 1.7 * upp), sr = Math.max(1, 1.0 * upp);
  svg.style.setProperty('--lw', lw.toFixed(2));
  svg.style.setProperty('--fs', (11.5 * upp).toFixed(2) + 'px');
  svg.style.setProperty('--sr', Math.max(3, 2.2 * upp).toFixed(2));
  svg.dataset.z = upp >= 3.4 ? '0' : (upp >= 1.6 ? '1' : (upp >= 0.8 ? '2' : '3'));
}
function bounds() { var xs = D.stations.map(function (s) { return s.x; }), ys = D.stations.map(function (s) { return s.y; }); return [Math.min.apply(0, xs) - 60, Math.min.apply(0, ys) - 60, Math.max.apply(0, xs) + 60, Math.max.apply(0, ys) + 60]; }
function insets() { var tp = document.querySelector('.top'), nt = document.querySelector('.note'); return [tp ? tp.offsetHeight : 0, nt ? nt.offsetHeight : 0]; }
function fit(b) { var ins = insets(), Hv = Math.max(H() - ins[0] - ins[1], 200); var w = b[2] - b[0], h = b[3] - b[1]; var vw = Math.max(w, h * W() / Hv, 280); var upp = vw / W(); vb.w = vw; vb.x = (b[0] + b[2]) / 2 - vw / 2; vb.y = (b[1] + b[3]) / 2 - Hv * upp / 2 - ins[0] * upp; apply(); }
function center(x, y, w) { var ins = insets(), Hv = Math.max(H() - ins[0] - ins[1], 200), upp = w / W(); vb.w = w; vb.x = x - w / 2; vb.y = y - Hv * upp / 2 - ins[0] * upp; apply(); }
function zoomAt(cx, cy, f) { // cx,cy in svg units
  var nw = Math.min(Math.max(vb.w * f, 60), 3200);
  var r = nw / vb.w; vb.x = cx - (cx - vb.x) * r; vb.y = cy - (cy - vb.y) * r; vb.w = nw; apply();
}
function toSvg(px, py) { var rect = wrap.getBoundingClientRect(), upp = vb.w / W(); return [vb.x + (px - rect.left) * upp, vb.y + (py - rect.top) * upp]; }
var pts = {}, last = null, moved = 0, downT = null;
wrap.addEventListener('pointerdown', function (e) { wrap.setPointerCapture(e.pointerId); pts[e.pointerId] = { x: e.clientX, y: e.clientY }; moved = 0; downT = e.target; last = null; });
wrap.addEventListener('pointermove', function (e) {
  if (!pts[e.pointerId]) return;
  var ids = Object.keys(pts), p = pts[e.pointerId], upp = vb.w / W();
  if (ids.length === 1) { vb.x -= (e.clientX - p.x) * upp; vb.y -= (e.clientY - p.y) * upp; moved += Math.abs(e.clientX - p.x) + Math.abs(e.clientY - p.y); pts[e.pointerId] = { x: e.clientX, y: e.clientY }; apply(); }
  else if (ids.length === 2) {
    var o = pts[ids[0] == e.pointerId ? ids[1] : ids[0]];
    var d0 = Math.hypot(p.x - o.x, p.y - o.y); pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    var d1 = Math.hypot(e.clientX - o.x, e.clientY - o.y); moved += 20;
    if (d0 > 0 && d1 > 0) { var m = toSvg((e.clientX + o.x) / 2, (e.clientY + o.y) / 2); zoomAt(m[0], m[1], d0 / d1); }
  }
});
function up(e) { var was = pts[e.pointerId]; delete pts[e.pointerId]; if (was && moved < 8 && Object.keys(pts).length === 0) tap(e); }
wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', function (e) { delete pts[e.pointerId]; });
wrap.addEventListener('wheel', function (e) { e.preventDefault(); var m = toSvg(e.clientX, e.clientY); zoomAt(m[0], m[1], e.deltaY > 0 ? 1.18 : 0.85); }, { passive: false });
function tap(e) {
  var m = toSvg(e.clientX, e.clientY), best = -1, bd = Infinity, upp = vb.w / W(), lim = 22 * upp;
  D.stations.forEach(function (s, i) { var d = Math.hypot(s.x - m[0], s.y - m[1]); if (d < bd) { bd = d; best = i; } });
  if (best > -1 && bd < lim) show(best); else closeSheet();
}
// sheet
var sheet = document.getElementById('sheet'), cur = -1;
function show(i) {
  cur = i; var s = D.stations[i];
  stEls.forEach(function (c) { c.classList.remove('hl'); }); stEls[i].classList.add('hl');
  document.getElementById('s1').textContent = s.zh; document.getElementById('s2').textContent = s.en;
  var k = document.getElementById('s3'); k.textContent = s.ko; k.style.display = (s.ko && koOn) ? '' : 'none';
  var ls = document.getElementById('s4'); ls.innerHTML = '';
  s.lines.forEach(function (id) { var sp = document.createElement('span'); sp.textContent = lname(id); sp.style.background = D.colors[id]; sp.style.color = fg(D.colors[id]); ls.appendChild(sp); });
  document.getElementById('s5').textContent = s.lines.length > 1 ? '환승역: ' + s.lines.map(lname).join(' ↔ ') : '';
  sheet.classList.add('show');
}
function closeSheet() { sheet.classList.remove('show'); stEls.forEach(function (c) { c.classList.remove('hl'); }); }
document.getElementById('sx').addEventListener('click', closeSheet);
// buttons
document.getElementById('zin').addEventListener('click', function () { zoomAt(vb.x + vb.w / 2, vb.y + vb.w * H() / W() / 2, 0.6); });
document.getElementById('zout').addEventListener('click', function () { zoomAt(vb.x + vb.w / 2, vb.y + vb.w * H() / W() / 2, 1.6); });
function home() { var p = D.stations.filter(function (s) { return s.zh === '人民广场'; })[0]; center(p.x, p.y, 640); }
document.getElementById('zc').addEventListener('click', home);
document.getElementById('za').addEventListener('click', function () { fit(bounds()); });

// 한국어 표시 버튼
var koOn = false; try { koOn = localStorage.getItem('pm_sw_ko') === '1'; } catch (e) {}
var kb = document.getElementById('kb');
function applyKo() { svg.classList.toggle('ko', koOn); kb.classList.toggle('on', koOn); kb.textContent = koOn ? '한국어 ON' : '한국어'; if (cur > -1 && sheet.classList.contains('show')) show(cur); }
kb.addEventListener('click', function () { koOn = !koOn; try { localStorage.setItem('pm_sw_ko', koOn ? '1' : '0'); } catch (e) {} applyKo(); });
// 구역 버튼
var REG = [
  ['푸동 시내 (루자쭈이)', ['陆家嘴', '浦东南路', '世纪大道', '上海科技馆', '浦东大道', '杨高中路']],
  ['푸동 디즈니·공항', ['龙阳路', '迪士尼', '浦东1号2号航站楼']],
  ['푸서 시내 (난징둥루·난징시루·쉬자후이)', ['南京东路', '南京西路', '徐家汇', '静安寺', '人民广场', '一大会址·新天地']],
  ['푸서 와이탄', ['南京东路', '豫园', '陆家嘴', '人民广场', '小南门']],
  ['푸서 훙차오 공항 근처', ['虹桥火车站', '虹桥2号航站楼', '虹桥1号航站楼', '国家会展中心', '上海动物园']]
];
var regsEl = document.getElementById('regs');
function byZh(n) { return D.stations.filter(function (s) { return s.zh === n; })[0]; }
REG.forEach(function (r, i) {
  var b = document.createElement('button'); b.className = 'reg'; b.textContent = r[0];
  b.addEventListener('click', function () {
    var ss = r[1].map(byZh).filter(Boolean), xs = ss.map(function (s) { return s.x; }), ys = ss.map(function (s) { return s.y; });
    fit([Math.min.apply(0, xs) - 70, Math.min.apply(0, ys) - 45, Math.max.apply(0, xs) + 70, Math.max.apply(0, ys) + 45]);
    closeSheet(); [].forEach.call(regsEl.children, function (c) { c.classList.toggle('on', c === b); });
  });
  regsEl.appendChild(b);
});
// search
var q = document.getElementById('q'), res = document.getElementById('res');
q.addEventListener('input', function () {
  var v = q.value.trim().toLowerCase(); res.innerHTML = '';
  if (!v) { res.style.display = 'none'; return; }
  var hit = D.stations.map(function (s, i) { return { s: s, i: i }; }).filter(function (o) { return (o.s.zh + ' ' + o.s.en + ' ' + o.s.ko).toLowerCase().indexOf(v) > -1; }).slice(0, 12);
  if (!hit.length) { res.innerHTML = '<button disabled>검색 결과가 없어요 (주요 역만 등록돼 있어요)</button>'; res.style.display = 'block'; return; }
  hit.forEach(function (o) { var b = document.createElement('button'); b.textContent = o.s.zh + ' · ' + o.s.en; if (o.s.ko) { var m = document.createElement('small'); m.textContent = o.s.ko; b.appendChild(m); } b.addEventListener('click', function () { res.style.display = 'none'; q.blur(); center(o.s.x, o.s.y, 220); show(o.i); }); res.appendChild(b); });
  res.style.display = 'block';
});
window.addEventListener('resize', apply);
// 시작: 도심
var topH = document.querySelector('.top').offsetHeight; res.style.top = (topH + 4) + 'px';
applyKo(); home(); window.__map = { vb: vb, show: show, fit: function () { fit(bounds()); }, home: home, center: center };
})();
</script>
